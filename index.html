<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1714" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسبحتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light dark; --h: 100dvh; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<title>مسبحتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;600&display=swap">
<style>
/* Layout: chips for the six adhkar, a bead ring that is itself the tap target, a hasanat strip, then the rosary size and controls. Each dhikr owns one color. */
:root {
  --bg: #edf3f0;
  --surface: #f8fbf9;
  --fg: #12302a;
  --muted: #5d7770;
  --gold: #a87414;
  --bead-off: #c9d8d2;
  --line: #d3e0da;
  --on-accent: #ffffff;
  --d0: #0f7a5f;
  --d1: #1f78b4;
  --d2: #5b4bb7;
  --d3: #b03a6e;
  --d4: #c2561a;
  --d5: #6b7d12;
  --accent: var(--d0);
  --font-display: "Amiri", "Traditional Arabic", serif;
  --font-body: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1714;
    --surface: #12231f;
    --fg: #e3efea;
    --muted: #8fb0a6;
    --gold: #e3b657;
    --bead-off: #27433c;
    --line: #213731;
    --on-accent: #0b1714;
    --d0: #4fc3a1;
    --d1: #6bb8ec;
    --d2: #a99af2;
    --d3: #f08ab4;
    --d4: #f19a62;
    --d5: #bfd45a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1714;
  --surface: #12231f;
  --fg: #e3efea;
  --muted: #8fb0a6;
  --gold: #e3b657;
  --bead-off: #27433c;
  --line: #213731;
  --on-accent: #0b1714;
  --d0: #4fc3a1;
  --d1: #6bb8ec;
  --d2: #a99af2;
  --d3: #f08ab4;
  --d4: #f19a62;
  --d5: #bfd45a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: var(--h); }
body {
  direction: rtl;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: calc(var(--h) - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  max-width: 460px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
  transition: color 0.25s;
}
.pill {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid var(--gold);
  border-radius: 999px;
  color: var(--gold);
  font-size: 0.78rem;
}
.pill b { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.hdr-r { display: flex; align-items: center; gap: 8px; }
button.pill { font-family: inherit; background: transparent; cursor: pointer; }
.duabtn { border-color: var(--accent); color: var(--accent); }
.duabtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.top { position: relative; width: 100%; }
.menu {
  position: absolute;
  top: calc(100% + 6px);
  inset-inline: 0;
  z-index: 15;
  max-height: min(62vh, 440px);
  overflow-y: auto;
  padding: 4px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.45);
}
.menu article {
  padding: 14px 2px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-display);
  font-size: 1.2rem;
  line-height: 1.9;
  white-space: pre-line;
  text-align: center;
}
.menu article:last-child { border-bottom: 0; }
.menu article { cursor: pointer; -webkit-user-select: none; user-select: none; }
.menu article .badge { display: inline-block; margin-top: 6px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-body); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.menu article.done { opacity: 0.55; }
.menu article.done .badge { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.menu article:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; border-radius: 10px; }
.mhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
.mreset { flex: none; font: inherit; font-size: 0.8rem; color: var(--gold); background: transparent; border: 1px solid var(--gold); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.menu article small { display: block; margin-top: 4px; font-family: var(--font-body); font-size: 0.78rem; color: var(--gold); }

.chips {
  width: 100%;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-block: 2px 4px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  font: inherit;
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px 6px 12px;
  cursor: pointer;
}
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.chip[aria-pressed="true"]::before { background: var(--on-accent); }
.chip:focus-visible, .ctl:focus-visible, .seg button:focus-visible, .ring:focus-visible, .amen:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ring {
  position: relative;
  width: min(100%, 250px, 32vh);
  min-width: 200px;
  aspect-ratio: 1;
  max-width: 100%;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 72%);
  box-shadow: 0 0 0 1px var(--line), 0 10px 30px -14px color-mix(in srgb, var(--accent) 55%, transparent);
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.25s;
}
.ring:active { transform: scale(0.985); }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.thread { fill: none; stroke: var(--line); stroke-width: 2; }
.inner { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
.bead { fill: var(--bead-off); transition: fill 0.12s; }
.bead.on { fill: var(--accent); }
.ring.done .bead.on { fill: var(--gold); }
.bead.cur { stroke: var(--gold); stroke-width: 2; }
.bead.imam { fill: var(--gold); }
.hl { fill: #fff; opacity: 0.38; pointer-events: none; }
.seg-bg { fill: none; stroke: var(--bead-off); stroke-width: 8; stroke-linecap: round; }
.seg-fill { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; }
.ring.done .seg-fill { stroke: var(--gold); }

.center {
  position: absolute;
  inset: 24%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-align: center;
  pointer-events: none;
}
.dhikr {
  font-family: var(--font-display);
  font-size: clamp(0.9rem, 3.8vw, 1.1rem);
  line-height: 1.3;
  color: var(--accent);
  text-wrap: balance;
  transition: color 0.25s;
}
.count {
  font-weight: 300;
  font-size: clamp(2.4rem, 11vw, 3.3rem);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.ring.pulse .count { animation: pop 0.14s ease-out; }
@keyframes pop { 50% { transform: scale(1.07); } }
.goal { font-size: 0.78rem; color: var(--muted); }
.ring.done .goal { color: var(--gold); font-weight: 600; }

.plus {
  position: absolute;
  top: 14%;
  inset-inline-start: 50%;
  translate: -50% 0;
  font-weight: 600;
  font-size: 1rem;
  color: var(--gold);
  pointer-events: none;
  animation: rise 0.8s ease-out forwards;
}
.plus { translate: 50% 0; }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

.stats {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.stat span { font-size: 0.72rem; color: var(--muted); }
.stat b { font-size: 1.15rem; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.verse {
  margin: 0;
  width: 100%;
  text-align: center;
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--muted);
}

.sahifa {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  text-align: center;
}
.sahifa h2 { margin: 0; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.sahifa .v { margin: 0; font-family: var(--font-display); font-size: 1rem; line-height: 1.5; }
.sahifa .h { font-size: 0.76rem; color: var(--muted); }
.marks { display: flex; gap: 5px; }
.marks span { flex: 1; height: 8px; border-radius: 4px; background: var(--bead-off); overflow: hidden; display: block; }
.marks i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.25s; }
@media (prefers-reduced-motion: reduce) { .marks i { transition: none; } }

.hdr-r { gap: 6px; }
.hdr-r .pill { padding: 3px 8px; font-size: 0.74rem; }
h1 { font-size: 1.5rem; }
header { flex-wrap: wrap; }
.cat { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; font: inherit; font-family: var(--font-display); font-size: 1.3rem; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; cursor: pointer; text-align: right; }
.cat:last-child { border-bottom: 0; }
.cat small { font-family: var(--font-body); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; border-radius: 10px; }
.mhead b { color: var(--fg); font-family: var(--font-display); font-size: 1.1rem; }

.fchips { position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; padding: 10px 0; background: var(--surface); border-bottom: 1px solid var(--line); }
.fchip { flex: 1; font: inherit; font-size: 0.82rem; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 0; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.fchip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mhint { padding: 18px 4px; text-align: center; color: var(--muted); font-size: 0.85rem; }

.controls { width: 100%; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.seg button {
  font: inherit;
  font-size: 0.95rem;
  padding: 10px 0;
  color: var(--fg);
  background: transparent;
  border: 0;
  cursor: pointer;
}
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.row { display: flex; gap: 10px; }
.ctl {
  flex: 1;
  font: inherit;
  font-size: 0.9rem;
  padding: 10px 0;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
.ctl.warn { border-color: var(--gold); color: var(--gold); }

.scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(5, 12, 10, 0.6);
  padding-top: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  direction: rtl;
  width: 100%;
  max-width: 460px;
  max-height: 100%;
  overflow-y: auto;
  text-align: center;
  background: var(--surface);
  color: var(--fg);
  border-top: 5px solid var(--accent);
  border-radius: 18px;
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: up 0.25s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet small { color: var(--muted); font-size: 0.8rem; }
.dua {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.55rem;
  line-height: 2;
  text-wrap: balance;
}
.src { color: var(--gold); font-size: 0.82rem; }
.amen {
  font: inherit;
  font-weight: 600;
  padding: 12px 0;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .ring.pulse .count, .plus, .sheet { animation: none; }
  .plus { display: none; }
  .bead, .ring, h1, .dhikr { transition: none; }
}
</style>
</head>
<body>

<div class="app" id="app" lang="ar">
  <div class="top">
    <header>
      <h1>مسبحتي</h1>
      <div class="hdr-r">
        <button class="pill duabtn" id="zBtn" type="button" aria-expanded="false" aria-controls="zMenu">أذكار ▾</button>
        <button class="pill duabtn" id="duaBtn" type="button" aria-expanded="false" aria-controls="duaMenu">أدعية ▾</button>
        <div class="pill">الحسنات <b id="totalH">٠</b></div>
      </div>
    </header>
    <div class="menu" id="zMenu" hidden role="region" aria-label="أذكار"></div>
    <div class="menu" id="duaMenu" hidden role="region" aria-label="أدعية"></div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="اختيار الذكر"></div>

  <div class="stage" id="stage">
    <button class="ring" id="ring" type="button" aria-label="سبّح">
      <svg viewBox="0 0 320 320" aria-hidden="true">
        <circle class="inner" cx="160" cy="160" r="104"></circle>
        <circle class="thread" cx="160" cy="160" r="132"></circle>
        <g id="beads"></g>
      </svg>
      <div class="center">
        <div class="dhikr" id="dhikr"></div>
        <div class="count" id="count">٠</div>
        <div class="goal" id="goal"></div>
      </div>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><span>حسنات هذا الذكر</span><b id="dhikrH">٠</b></div>
    <div class="stat"><span>عدد مرات هذا الذكر</span><b id="dhikrN">٠</b></div>
  </div>
  <p class="verse">﴿مَن جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا﴾ الأنعام ١٦٠</p>

  <section class="sahifa" aria-label="صحيفتي">
    
    <p class="v">﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾ هود ١١٤</p>
    
    
    <div class="h">«وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا» رواه الترمذي</div>
  </section>

  <div class="controls">
    <div class="seg" id="seg" role="group" aria-label="حجم السبحة"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <small id="dtitle"></small>
    <p class="dua" id="duaText"></p>
    <div class="src" id="duaSrc"></div>
    <button class="amen" id="amen" type="button">آمين</button>
  </div>
</div>

<script>
(function () {
  var DHIKR = ["سبحان الله", "الحمد لله", "الله أكبر", "لا إله إلا الله", "أستغفر الله", "اللهم صلِّ على محمد"];
  var SIZES = [33, 100, 1000];
  var HASANA = 10;
  var KEY = "masbaha-v2";

  var DUAS = [
    { q: 1, t: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", s: "سورة البقرة ٢٠١" },
    { q: 0, t: "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", s: "رواه الترمذي وابن ماجه" },
    { q: 1, t: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", s: "سورة طه ٢٥-٢٦" },
    { q: 0, t: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", s: "رواه الترمذي" },
    { q: 1, t: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ", s: "سورة آل عمران ٨" },
    { q: 0, t: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", s: "رواه مسلم" },
    { q: 1, t: "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", s: "سورة الأعراف ٢٣" },
    { q: 0, t: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", s: "رواه أبو داود والنسائي" },
    { q: 1, t: "رَبِّ زِدْنِي عِلْمًا", s: "سورة طه ١١٤" },

      { c: 0, k: "s", s: "رواه الترمذي وحسّنه، وضعّفه الألباني", t: "اللَّهُمَّ ارزُقني حُبَّكَ، وحُبَّ مَنْ يَنْفَعُني حُبُّهُ عندَك، اللَّهُمَّ مَا رَزَقْتَني مِمَّا أُحِبُّ فَاجْعَلْهُ قُوَّةً لِي فِيمَا تُحِبُّ، اللَّهُمَّ مَا زَوَيْتَ عَنِّي مِمَّا أُحِبُّ فَاجْعَلْهُ فَرَاغاً لِي فِيمَا تُحِبُّ" },
      { c: 1, k: "s", t: "اللَّهُمَّ إنّي أعُوذُ بِكَ مِنْ يَوْمِ السُّوءِ، وَمِنْ لَيْلَةِ السُّوءِ، وَمِنْ سَاعَةِ السُّوءِ، وَمِنْ صَاحِبِ السُّوءِ، وَمِنْ جَارِ السُّوءِ في دَارِ الْمُقامَةِ" },
      { c: 1, k: "s", s: "رواه أبو داود", t: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ؛ فَإِنَّهُ بِئْسَ الضَّجِيعُ، وَأَعُوذُ بِكَ مِنَ الْخِيَانَةِ؛ فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ" },
      { c: 1, k: "s", t: "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي، وَوَسِّعْ لِي فِي دَارِي، وَبَارِكْ لِي فِيمَا رَزَقْتَنِي" },
      { c: 0, k: "s", s: "رواه الترمذي", t: "اللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا تَحُولُ بِهِ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ، وَمِنْ طَاعَتِكَ مَا تُبَلِّغُنَا بِهِ جَنَّتَكَ، وَمِنَ الْيَقِينِ مَا تُهَوِّنُ بِهِ عَلَيْنَا مَصَائِبَ الدُّنْيَا، اللَّهُمَّ مَتِّعْنَا بِأَسْمَاعِنَا، وَأَبْصَارِنَا، وَقُوَّاتِنَا مَا أَحْيَيْتَنَا، وَاجْعَلْهُ الْوَارِثَ مِنَّا، وَاجْعَلْ ثَأْرَنَا عَلَى مَنْ ظَلَمَنَا، وَانْصُرْنَا عَلَى مَنْ عَادَانَا، وَلَا تَجْعَلْ مُصِيبَتَنَا فِي دِينِنَا، وَلَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا، وَلَا مَبْلَغَ عِلْمِنَا، وَلَا تُسَلِّطْ عَلَيْنَا مَنْ لَا يَرْحَمُنَا" },
      { c: 0, k: "s", s: "رواه الترمذي", t: "اللَّهُمَّ إِنِّي أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَغْفِرَ لِي، وَتَرْحَمَنِي، وَإِذَا أَرَدْتَ فِتْنَةَ قَوْمٍ فَتَوَفَّنِي غَيْرَ مَفْتُونٍ، وَأَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ عَمَلٍ يُقَرِّبُنِي إِلَى حُبِّكَ" },
      { c: 0, k: "s", s: "رواه الترمذي وابن ماجه", t: "اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي" },
      { c: 1, k: "s", s: "رواه أبو داود والنسائي", t: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ، وَالْجُنُونِ، وَالْجُذَامِ، وَمِنْ سَيِّئِ الأَسْقَامِ" },
      { c: 0, k: "s", s: "رواه مسلم", t: "اللَّهُمَّ مُصَرِّفَ القُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ" },
      { c: 2, k: "s", s: "رواه أحمد", t: "اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي" },

      { c: 0, k: "s", s: "رواه مسلم", t: "اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ" },

      { c: 0, k: "s", s: "رواه أبو داود والترمذي", t: "رَبِّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ، وَاهْدِنِي وَيَسِّرِ الهُدَى إِلَيَّ، وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَيَّ، رَبِّ اجْعَلْنِي لَكَ شَكَّارًا، لَكَ ذَكَّارًا، لَكَ رَهَّابًا، لَكَ مِطْوَاعًا، إِلَيْكَ مُخْبِتًا أَوَّاهاً مُنِيبًا، رَبِّ تَقَبَّلْ تَوْبَتِي، وَاغْسِلْ حَوْبَتِي، وَأَجِبْ دَعْوَتِي، وَثَبِّتْ حُجَّتِي، وَاهْدِ قَلْبِي، وَسَدِّدْ لِسَانِي، وَاسْلُلْ سَخِيمَةَ قَلْبِي" },

      { c: 2, k: "q", s: "سورة العنكبوت ٣٠", t: "رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ" },

      { c: 0, k: "q", s: "سورة المؤمنون ٩٧-٩٨", t: "رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ * وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ" },

      { c: 0, k: "q", s: "سورة إبراهيم ٤١", t: "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ" },

      { c: 1, k: "s", s: "رواه الطبراني عن ابن مسعود، وفي ثبوته خلاف بين العلماء", t: "اللَّهُمَّ إنِّي أَسْأَلُك مِنْ فَضْلِكَ وَرَحْمَتِكَ؛ فَإِنَّهُ لاَ يَمْلِكُهَا إِلاَّ أَنْتَ" },
      { c: 1, k: "s", s: "رواه أبو داود والنسائي", t: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الهَرَمِ، وَالتَّرَدِّي، وَالْهَدْمِ، وَالْغَمِّ، وَالْغَرَقِ، وَالْحَرَقِ، وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِيَ الشَّيْطَانُ عِنْدَ الْمَوْتِ، وَأَعُوذُ بِكَ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِرًا، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا" },
      { c: 0, k: "s", s: "رواه البخاري ومسلم", t: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ. فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ" },
      { c: 1, k: "s", s: "رواه الحاكم", t: "اللَّهُمَّ احْفَظنِي بالإِسْلاَمِ قائِماً، واحْفَظْنِي بالإِسْلاَمِ قاعِداً، واحْفَظنِي بالإِسْلاَمِ راقِداً، ولا تُشْمِتْ بِي عَدُوّاً ولا حاسِداً. اللَّهُمَّ إِنِّي أسْألُكَ مِنْ كُلِّ خَيْر خزائِنُهُ بِيَدِكَ، وأعُوذُ بِكَ مِنْ كُلِّ شَرٍّ خَزَائِنُهُ بِيَدِكَ" },

  var DUAS_ALL = null;
  function dData() {
    if (!DUAS_ALL) {
      MY_DUAS.forEach(function (d, i) { d.c = META[i].c; d.k = META[i].k; if (META[i].s) d.s = META[i].s; });
      DUAS_ALL = MY_DUAS.concat(moreDuas());
      DUAS_ALL.forEach(function (d, i) { d.i = i; });
    }
    return DUAS_ALL;
  }
  function dn(d) { return d.n || DUA_TIMES; }
  function dGet(d) { return state.d[d.i] || 0; }
  function dMatch(d) { return state.df === "all" || (state.df === "rev" ? d.k !== "h" : d.k === "h"); }
  function dItems(c) {
    return dData().filter(function (d) { return (c === null || d.c === c) && dMatch(d); })
      .sort(function (a, b) { return (a.c - b.c) || ((a.o || 0) - (b.o || 0)) || (a.i - b.i); });
  }

  var menu = document.getElementById("duaMenu");
  var duaBtn = document.getElementById("duaBtn");

  function dRender(view) {
    menu.textContent = "";
    if (false) {
      var fc = document.createElement("div");
      fc.className = "fchips";
      [["all", "الكل"], ["rev", "قرآن وسنة"], ["h", "نور"]].forEach(function (f) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "fchip";
        b.textContent = f[1];
        b.setAttribute("aria-pressed", String(state.df === f[0]));
        b.addEventListener("click", function () { state.df = f[0]; save(); dRender(null); });
        fc.appendChild(b);
      });
      
      DCATS.forEach(function (name, ci) {
        var list = dItems(ci);
        var done = list.filter(function (d) { return dGet(d) >= dn(d); }).length;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cat";
        var nm = document.createElement("span");
        nm.textContent = name;
        var pg = document.createElement("small");
        pg.textContent = fmt(done) + " / " + fmt(list.length);
        b.appendChild(nm);
        b.appendChild(pg);
        b.addEventListener("click", function () { dRender(ci); menu.scrollTop = 0; });
        menu.appendChild(b);
      });
      return;
    }

    var items = dItems(null);
    var head = document.createElement("div");
    head.className = "mhead";
    var back = document.createElement("button");
    back.type = "button";
    back.className = "mreset";
    back.textContent = "رجوع";
    back.addEventListener("click", function () { dRender(null); menu.scrollTop = 0; });
    var ttl = document.createElement("b");
    ttl.textContent = "الأدعية";
    var rs = document.createElement("button");
    rs.type = "button";
    rs.className = "mreset";
    rs.textContent = "إعادة";
    var armed = false, timer = null;
    rs.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        rs.textContent = "تأكيد؟";
        timer = setTimeout(function () { armed = false; rs.textContent = "إعادة"; }, 3000);
      } else {
        clearTimeout(timer);
        items.forEach(function (d) { delete state.d[d.i]; });
        save();
        dRender(0);
      }
    });
    var cnt = document.createElement("small"); cnt.textContent = " " + fmt(items.filter(function (d) { return dGet(d) >= dn(d); }).length) + " / " + fmt(items.length); ttl.appendChild(cnt);
    head.appendChild(ttl);
    head.appendChild(rs);
    menu.appendChild(head);

    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "mhint";
      empty.textContent = "لا توجد أدعية في هذا القسم مع الفلتر الحالي";
      menu.appendChild(empty);
      return;
    }

    var nodes = [];
    items.forEach(function (d) {
      var a = document.createElement("article");
      a.tabIndex = 0;
      a.setAttribute("role", "button");
      var body = document.createElement("div");
      body.textContent = d.t;
      a.appendChild(body);
      var sm = document.createElement("small");
      sm.textContent = KIND[d.k] + (d.s ? " · " + d.s : "");
      a.appendChild(sm);
      var badge = document.createElement("span");
      badge.className = "badge";
      a.appendChild(badge);
      function tap() {
        var c = dGet(d);
        if (c >= dn(d)) return;
        state.d[d.i] = c + 1;
        buzz(c + 1 === dn(d) ? [50, 40, 50] : 10);
        save();
        paint();
      }
      a.addEventListener("click", tap);
      a.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } });
      menu.appendChild(a);
      nodes.push({ el: a, badge: badge, d: d });
    });
    function paint() {
      nodes.forEach(function (x) {
        var c = dGet(x.d), done = c >= dn(x.d);
        x.badge.textContent = done ? "✓ تم" : fmt(c) + " / " + fmt(dn(x.d));
        x.el.classList.toggle("done", done);
      });
    }
    paint();
  }

  function toggleMenu(open) {
    menu.hidden = !open;
    duaBtn.setAttribute("aria-expanded", String(open));
    duaBtn.textContent = open ? "أدعية ▴" : "أدعية ▾";
    if (open) { dRender(null); menu.scrollTop = 0; }
  }
  duaBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleMenu(menu.hidden); });
  document.addEventListener("click", function (e) {
    if (menu.hidden) return;
    var path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(menu) < 0) toggleMenu(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { toggleMenu(false); duaBtn.focus(); } });

    { t: q("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الرَّحْمَٰنِ الرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"), n: 7, s: "سورة الفاتحة" },
    { t: q(BAQ102), n: 1, s: "سورة البقرة ١٠٢" },
    { t: q(AYAT), n: 1, s: "آية الكرسي" },
    { t: q(BAQ), n: 1, s: "آخر آيتين من سورة البقرة" },
    { t: q(IKH), n: 3, s: "سورة الإخلاص" },
    { t: q(FAL), n: 3, s: "سورة الفلق" },
    { t: q(NAS), n: 3, s: "سورة الناس" },
    { t: "بِسْمِ اللَّهِ", n: 3, s: "ضعي يدك على موضع الألم وقولي (رواه مسلم)" },
    { t: "أَعُوذُ بِعِزَّةِ اللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ", n: 7, s: "ثم قولي سبع مرات (رواه مسلم وأبو داود والترمذي بروايات متقاربة)" },
    { t: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", n: 3, s: "رواه أبو داود والترمذي" },
    { t: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ", n: 3, s: "أصله في البخاري: «أُعيذكما…» (للأبناء) وهنا بصيغة المتكلم" },
    { t: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", n: 3, s: "رواه مسلم" },
    { t: "بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ", n: 3, s: "رقية جبريل للنبي صلى الله عليه وسلم (رواه مسلم)" }
  ];

  var CATS = [
    { name: "أذكار الصباح", items: daily(true) },
    { name: "أذكار المساء", items: daily(false) },
    { name: "أذكار النوم", items: SLEEP },
    { name: "عند الاستيقاظ", items: WAKE },
    { name: "بعد الصلاة", items: AFTER },
    { name: "الرقية الشرعية", items: RUQYAH, nh: true }
  ];

  var zMenu = document.getElementById("zMenu");
  var zBtn = document.getElementById("zBtn");
  var todayKey = new Date().toDateString();
  if (state.zday !== todayKey) { state.z = {}; state.zday = todayKey; save(); }
  state.z = state.z || {};
  function zKey(c, i) { return c + "_" + i; }
  function zGet(c, i) { return state.z[zKey(c, i)] || 0; }

  function zRender(view) {
    zMenu.textContent = "";
    if (view === null) {
      CATS.forEach(function (c, ci) {
        var done = c.items.filter(function (it, ii) { return zGet(ci, ii) >= it.n; }).length;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cat";
        var nm = document.createElement("span");
        nm.textContent = c.name;
        var pg = document.createElement("small");
        pg.textContent = fmt(done) + " / " + fmt(c.items.length);
        b.appendChild(nm);
        b.appendChild(pg);
        b.addEventListener("click", function () { zRender(ci); zMenu.scrollTop = 0; });
        zMenu.appendChild(b);
      });
      return;
    }
    var cat = CATS[view];
    var head = document.createElement("div");
    head.className = "mhead";
    var back = document.createElement("button");
    back.type = "button";
    back.className = "mreset";
    back.textContent = "رجوع";
    back.addEventListener("click", function () { zRender(null); zMenu.scrollTop = 0; });
    var ttl = document.createElement("b");
    ttl.textContent = cat.name;
    var rs = document.createElement("button");
    rs.type = "button";
    rs.className = "mreset";
    rs.textContent = "إعادة";
    var armed = false, timer = null;
    rs.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        rs.textContent = "تأكيد؟";
        timer = setTimeout(function () { armed = false; rs.textContent = "إعادة"; }, 3000);
      } else {
        clearTimeout(timer);
        cat.items.forEach(function (it, ii) { delete state.z[zKey(view, ii)]; });
        save();
        zRender(view);
      }
    });
    head.appendChild(back);
    head.appendChild(ttl);
    head.appendChild(rs);
    zMenu.appendChild(head);

    var nodes = [];
    cat.items.forEach(function (it, ii) {
      var a = document.createElement("article");
      a.tabIndex = 0;
      a.setAttribute("role", "button");
      var body = document.createElement("div");
      body.textContent = it.t;
      a.appendChild(body);
      if (it.s) {
        var sm = document.createElement("small");
        sm.textContent = it.s;
        a.appendChild(sm);
      }
      var badge = document.createElement("span");
      badge.className = "badge";
      a.appendChild(badge);
      var big = it.n > 10;
      function tap() {
        var c = zGet(view, ii);
        if (big) state.z[zKey(view, ii)] = c >= it.n ? 0 : it.n;
        else if (c < it.n) { state.z[zKey(view, ii)] = c + 1; if (!cat.nh) state.az = (state.az || 0) + 1; }
        else return;
        buzz(zGet(view, ii) >= it.n ? [50, 40, 50] : 10);
        save();
        paint();
        render();
      }
      a.addEventListener("click", tap);
      a.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } });
      zMenu.appendChild(a);
      nodes.push({ el: a, badge: badge, it: it });
    });
    function paint() {
      nodes.forEach(function (x, ii) {
        var c = zGet(view, ii);
        var done = c >= x.it.n;
        x.badge.textContent = done ? "✓ تم" : x.it.n > 10 ? "× " + fmt(x.it.n) + " (استخدمي المسبحة ثم اضغطي)" : fmt(c) + " / " + fmt(x.it.n);
        x.el.classList.toggle("done", done);
      });
    }
    paint();
  }

  function toggleZ(open) {
    zMenu.hidden = !open;
    zBtn.setAttribute("aria-expanded", String(open));
    zBtn.textContent = open ? "أذكار ▴" : "أذكار ▾";
    if (open) { zRender(null); zMenu.scrollTop = 0; }
  }
  zBtn.addEventListener("click", function (e) { e.stopPropagation(); if (zMenu.hidden) toggleMenu(false); toggleZ(zMenu.hidden); });
  duaBtn.addEventListener("click", function () { if (!zMenu.hidden) toggleZ(false); });
  document.addEventListener("click", function (e) {
    if (zMenu.hidden) return;
    var path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(zMenu) < 0) toggleZ(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !zMenu.hidden) { toggleZ(false); zBtn.focus(); } });

  render();
})();
</script>
